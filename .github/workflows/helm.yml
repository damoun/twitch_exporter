name: Helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"

jobs:
  helm:
    uses: damoun/.github/.github/workflows/helm.yml@f95c8f2f44951cf9126e66c062c7c0ca3de7762a # main
    permissions:
      contents: read
      security-events: write
