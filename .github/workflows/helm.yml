name: Helm

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/helm.yml"

jobs:
  helm:
    uses: damoun/.github/.github/workflows/helm.yml@9434c1a64d428e24729db1cf95a4463e00b1981e # main
    permissions:
      contents: read
      security-events: write
