name: Image

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/image.yml"

jobs:
  image:
    uses: damoun/.github/.github/workflows/image.yml@9434c1a64d428e24729db1cf95a4463e00b1981e # main
    permissions:
      contents: read
      security-events: write
    with:
      image: ghcr.io/damoun/twitch-exporter:latest
