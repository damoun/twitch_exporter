name: Image

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/image.yml"

jobs:
  image:
    uses: damoun/.github/.github/workflows/image.yml@04d039b413bbd9b95d225fc71978334581f9197f # main
    permissions:
      contents: read
      security-events: write
    with:
      image: ghcr.io/damoun/twitch-exporter:latest
