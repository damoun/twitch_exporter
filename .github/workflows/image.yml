name: Image

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/image.yml"

jobs:
  image:
    uses: damoun/.github/.github/workflows/image.yml@f95c8f2f44951cf9126e66c062c7c0ca3de7762a # main
    permissions:
      contents: read
      security-events: write
    with:
      image: ghcr.io/damoun/twitch-exporter:latest
